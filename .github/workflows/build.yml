name: Build JianQi Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx2g -Dfile.encoding=UTF-8"
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o *.zip -d project/
          ls -la project/

      - name: Locate build.gradle
        run: |
          BUILD_DIR=$(dirname "$(find project -name build.gradle | head -1)")
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

      - name: Patch build.gradle (jcenter is dead, use mirror)
        run: |
          sed -i "s|jcenter()|maven { url = \"https://maven.aliyun.com/repository/public\" }|g" "$BUILD_DIR/build.gradle"
          sed -i "s|https://files.minecraftforge.net/maven|https://maven.minecraftforge.net/|g" "$BUILD_DIR/build.gradle"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Setup Gradle 4.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 4.9

      - name: Build
        working-directory: ${{ env.BUILD_DIR }}
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jianqi-mod
          path: ${{ env.BUILD_DIR }}/build/libs/*.jar
